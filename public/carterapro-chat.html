<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CarteraPro · Conversación completa</title>
<style>
:root{--nav:#0d1424;--line:#e1e6ef;--txt:#101827;--muted:#7b8798;--blue:#536dff;--bg:#f5f7fb}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}
button,textarea{font:inherit}
/* Elementos anclados DIRECTAMENTE al viewport */
.topbar{position:fixed;z-index:100;left:0;right:0;top:0;height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;box-shadow:0 2px 10px rgba(15,23,42,.03)}
.leftHead{display:flex;align-items:center;gap:10px;min-width:0}.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer}.title{min-width:0}.title h1{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title p{font-size:9px;color:var(--muted);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v{font-size:8px;background:#eef1ff;color:#5167e7;padding:4px 7px;border-radius:999px;font-weight:900}
.actions{display:flex;gap:6px}.small{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:8px;font-weight:900;cursor:pointer}
#messages{position:fixed;z-index:1;left:0;right:0;top:68px;bottom:126px;overflow-y:auto!important;overflow-x:hidden!important;padding:15px max(18px,calc((100vw - 980px)/2)) 32px;background:radial-gradient(circle at 85% 0,rgba(83,109,255,.05),transparent 30%),#f5f7fb;scrollbar-gutter:stable;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#messages::-webkit-scrollbar{width:12px}#messages::-webkit-scrollbar-track{background:#edf1f6}#messages::-webkit-scrollbar-thumb{background:#b6c0cf;border:3px solid #edf1f6;border-radius:999px}
.loaderRow{position:sticky;top:0;z-index:8;text-align:center;padding:4px 0 13px}.older{border:1px solid #dce3ee;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:999px;padding:7px 11px;font-size:8px;font-weight:900;color:#596679;cursor:pointer;box-shadow:0 3px 10px rgba(15,23,42,.05)}
.row{display:flex;margin:8px 0}.row.in{justify-content:flex-start}.row.out{justify-content:flex-end}.bubble{max-width:min(72%,720px);border-radius:16px;padding:10px 12px;font-size:11px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 7px rgba(15,23,42,.04)}.in .bubble{background:#fff;border:1px solid #e0e6ef;border-bottom-left-radius:5px}.out .bubble{background:#e6ecff;border:1px solid #d3ddff;border-bottom-right-radius:5px}.out.manual .bubble{background:#e7f7f0;border-color:#d2ebe0}.out.emisor .bubble{background:#f1edff;border-color:#ded6fb}.meta{display:flex;justify-content:space-between;gap:12px;color:#8490a0;font-size:7px;margin-top:5px}.media{margin-top:6px;padding-top:6px;border-top:1px dashed #cfd7e4;font-size:8px}
.empty{height:100%;display:grid;place-items:center;color:#8290a3;text-align:center}.empty b{display:block;color:#586476;margin-bottom:5px}
.composer{position:fixed;z-index:100;left:0;right:0;bottom:0;height:126px;background:#fff;border-top:1px solid var(--line);padding:8px max(14px,calc((100vw - 980px)/2)) 10px;box-shadow:0 -7px 22px rgba(15,23,42,.06)}
.quick{height:29px;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:5px}.quick button{flex:0 0 auto;border:1px solid #dfe5ee;background:#f9fafc;color:#637086;border-radius:999px;padding:5px 9px;font-size:8px;font-weight:900;cursor:pointer}.sendrow{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:8px;height:75px;align-items:stretch}.sendrow textarea{height:68px;min-height:68px;max-height:68px;resize:none;border:1px solid #dbe2ec;border-radius:12px;padding:10px;font-size:11px;outline:none}.sendrow textarea:focus{border-color:#9aabff;box-shadow:0 0 0 3px rgba(83,109,255,.08)}.send{height:68px;border:0;border-radius:12px;background:linear-gradient(135deg,#506cff,#7459f6);color:#fff;font-size:9px;font-weight:950;cursor:pointer}.send:disabled{opacity:.55;cursor:not-allowed}
.jump{position:fixed;z-index:110;right:20px;bottom:140px;border:1px solid #dce3ed;background:#fff;border-radius:999px;padding:8px 11px;font-size:8px;font-weight:950;color:#596679;box-shadow:0 5px 16px rgba(15,23,42,.12);cursor:pointer;display:none}.jump.show{display:block}
.toast{position:fixed;z-index:200;right:18px;top:78px;background:#101827;color:#fff;padding:9px 11px;border-radius:10px;font-size:9px;display:none}
@media(max-width:700px){.topbar{height:62px;padding:7px 9px}.actions .desktopOnly{display:none}#messages{top:62px;bottom:118px;padding:10px 8px 26px}.composer{height:118px;padding:6px 8px 8px}.quick{height:28px}.sendrow{height:70px;grid-template-columns:minmax(0,1fr) 65px}.sendrow textarea,.send{height:63px;min-height:63px;max-height:63px}.bubble{max-width:88%}.jump{bottom:128px;right:10px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="leftHead">
    <button class="back" onclick="goBack()">← Inbox</button>
    <div class="title"><h1 id="name">Cargando conversación…</h1><p id="sub">CarteraPro · conversación completa</p></div>
    <span class="v">CHAT v4</span>
  </div>
  <div class="actions">
    <button class="small desktopOnly" onclick="exportChat()">Exportar TXT</button>
    <button class="small" onclick="syncPhone()">↻ Twilio</button><button class="small" onclick="reloadChat(true)">Actualizar</button>
  </div>
</header>
<main id="messages"><div class="empty"><div><b>Cargando</b>Recuperando conversación…</div></div></main>
<button id="jump" class="jump" onclick="goBottom(true)">↓ Último mensaje</button>
<footer class="composer">
  <div class="quick">
    <button onclick="put('Hola. Te comparto la demo interactiva de CarteraPro:\nhttps://carteraproautos.netlify.app/demo.html\n\nPuedes probarla y si tienes dudas te ayudo por aquí.')">Demo</button>
    <button onclick="put('Plan Básico · $499 MXN al mes\nhttps://mpago.la/1aeVAtg')">Básico $499</button>
    <button onclick="put('Plan Plus · $698 MXN al mes\nhttps://mpago.la/1edpYeR')">Plus $698</button>
    <button onclick="put('La carga inicial está incluida sin costo adicional. Puedes usar acceso temporal al portal o subir un ZIP con los PDF de los últimos 12 meses.')">Carga inicial</button>
  </div>
  <div class="sendrow"><textarea id="reply" placeholder="Escribe aquí… Enter para enviar · Shift+Enter para salto de línea"></textarea><button id="send" class="send" onclick="sendReply()">Enviar</button></div>
</footer>
<div id="toast" class="toast"></div>
<script>
const q=new URLSearchParams(location.search), phone=(q.get('phone')||'').replace(/\D/g,''), token=q.get('token')||localStorage.getItem('adminToken')||'';
if(token)localStorage.setItem('adminToken',token);
const PAGE=40; let allMessages=[],visibleStart=0,info=null,loading=false;
const box=document.getElementById('messages');
function h(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){try{return new Date(v).toLocaleString('es-MX')}catch{return v||''}}
function who(m){if(m.direction==='inbound')return'Cliente';if(m.source==='manual')return'Tú';if(m.source==='emisor')return'Bot emisor';if(String(m.source||'').includes('carterapro'))return'Bot CarteraPro';return'Bot'}
function toastMsg(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>toast.style.display='none',2200)}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),'Content-Type':'application/json','x-admin-token':token}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function nearBottom(){return box.scrollHeight-box.scrollTop-box.clientHeight<100}
function updateJump(){jump.classList.toggle('show',box.scrollHeight-box.scrollTop-box.clientHeight>160)}
function goBottom(smooth=false){if(box.scrollTo)box.scrollTo({top:box.scrollHeight,behavior:smooth?'smooth':'auto'});else box.scrollTop=box.scrollHeight;updateJump()}
function goBack(){location.href='/carterapro-inbox.html?token='+encodeURIComponent(token)+'&v=4'}
function put(t){reply.value=t;reply.focus()}
function render(preserveOlder=false){
 const beforeHeight=box.scrollHeight,beforeTop=box.scrollTop;
 const visible=allMessages.slice(visibleStart);
 const older=visibleStart>0?`<div class="loaderRow"><button class="older" onclick="loadOlder()">↑ Cargar ${Math.min(PAGE,visibleStart)} mensajes anteriores <small>(${visibleStart} restantes)</small></button></div>`:'<div class="loaderRow"><span style="font-size:8px;color:#9aa5b5">Inicio del historial disponible</span></div>';
 if(!visible.length){box.innerHTML='<div class="empty"><div><b>Sin mensajes</b>No hay mensajes disponibles para este chat.</div></div>';return}
 box.innerHTML=older+visible.map(m=>{const cls=m.direction==='inbound'?'in':`out ${m.source==='manual'?'manual':m.source==='emisor'?'emisor':''}`;return `<div class="row ${cls}"><div class="bubble">${h(m.body||'')}${m.mediaUrl?`<div class="media">Archivo/media: ${h(m.mediaUrl)}</div>`:''}<div class="meta"><span>${h(who(m))}</span><span>${h(fmt(m.createdAt))}</span></div></div></div>`}).join('');
 if(preserveOlder){requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight-beforeHeight+beforeTop;updateJump()})}
}
function loadOlder(){if(visibleStart<=0)return;visibleStart=Math.max(0,visibleStart-PAGE);render(true)}
async function reloadChat(forceBottom=false){
 if(!phone)return toastMsg('Falta teléfono en la URL');if(loading)return;loading=true;
 const wasBottom=nearBottom();
 try{const d=await api('/api/admin/carterapro/thread/'+encodeURIComponent(phone)+'?limit=2000');info=d;allMessages=d.messages||[];visibleStart=Math.max(0,allMessages.length-PAGE);name.textContent=d.lead?.name||d.onboarding?.name||('+'+phone);sub.textContent='+'+phone+' · '+(d.stage?.label||'Sin clasificar')+' · '+allMessages.length+' mensajes disponibles';render(false);requestAnimationFrame(()=>{if(forceBottom||wasBottom)goBottom(false);else updateJump()})}catch(e){box.innerHTML=`<div class="empty"><div><b>Error</b>${h(e.message)}</div></div>`}finally{loading=false}
}
async function syncPhone(){
 try{const d=await api('/api/admin/carterapro/sync-twilio',{method:'POST',body:JSON.stringify({phone,limit:400})});toastMsg(`Sincronizado: ${d.fetched||0} revisados · ${d.stored||0} recuperados`);await reloadChat(true)}catch(e){toastMsg(e.message)}
}
async function sendReply(){const body=reply.value.trim();if(!body)return;send.disabled=true;try{await api('/api/admin/messages/reply',{method:'POST',body:JSON.stringify({phone,body})});reply.value='';await reloadChat(true);toastMsg('Mensaje enviado · bot pausado 12 h')}catch(e){toastMsg(e.message)}finally{send.disabled=false}}
function exportChat(){if(!allMessages.length)return;const text=allMessages.map(m=>`[${fmt(m.createdAt)}] ${who(m)}: ${m.body||''}${m.mediaUrl?'\nArchivo: '+m.mediaUrl:''}`).join('\n\n');const b=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`CarteraPro_${phone}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
reply.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply()}});box.addEventListener('scroll',updateJump,{passive:true});
reloadChat(true);setInterval(()=>{if(nearBottom())reloadChat(true)},20000);
</script>
</body>
</html>
